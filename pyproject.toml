[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lean-sdd"
version = "0.3.5"
description = "Install an issue-driven GitHub workflow for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lean-sdd = "lean_sdd.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/lean_sdd"]
exclude = [
    "src/lean_sdd/template_overrides",
    "**/.env*", "**/__pycache__", "**/*.pyc",
    "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache",
    "**/node_modules", "**/.build",
]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "lean_sdd_templates/common/AGENTS.md"
"CONSTITUTION.md" = "lean_sdd_templates/common/CONSTITUTION.md"
"CODING_STANDARDS.md" = "lean_sdd_templates/profiles/python/standards.md"
"src/lean_sdd/template_overrides/typescript-standards.md" = "lean_sdd_templates/profiles/typescript/standards.md"
"docs/typescript.md" = "lean_sdd_templates/profiles/typescript/guide.md"
"src/lean_sdd/template_overrides/common-standards.md" = "lean_sdd_templates/common/CODING_STANDARDS.md"
"docs/configuration.md" = "lean_sdd_templates/common/.agents/docs/configuration.md"
"docs/profiles.md" = "lean_sdd_templates/common/.agents/docs/profiles.md"
"docs/diagnostics.md" = "lean_sdd_templates/common/.agents/docs/diagnostics.md"
"docs/validation.md" = "lean_sdd_templates/common/.agents/docs/validation.md"
".agents/README.md" = "lean_sdd_templates/common/.agents/README.md"
".agents/.env.example" = "lean_sdd_templates/common/.agents/.env.example"
".agents/github-mcp-contract.md" = "lean_sdd_templates/common/.agents/github-mcp-contract.md"
".agents/github-issue-contract.md" = "lean_sdd_templates/common/.agents/github-issue-contract.md"
".agents/lib/github-identity.sh" = "lean_sdd_templates/common/.agents/lib/github-identity.sh"
".agents/lib/github-issues.sh" = "lean_sdd_templates/common/.agents/lib/github-issues.sh"
".agents/lib/github-mcp.sh" = "lean_sdd_templates/common/.agents/lib/github-mcp.sh"
".agents/lib/github-pr.sh" = "lean_sdd_templates/common/.agents/lib/github-pr.sh"
".agents/lib/mcp.sh" = "lean_sdd_templates/common/.agents/lib/mcp.sh"
".agents/skills/create-issue/SKILL.md" = "lean_sdd_templates/common/.agents/skills/create-issue/SKILL.md"
".agents/skills/create-issue/scripts/create-issue.sh" = "lean_sdd_templates/common/.agents/skills/create-issue/scripts/create-issue.sh"
".agents/skills/finalize-implementation/SKILL.md" = "lean_sdd_templates/common/.agents/skills/finalize-implementation/SKILL.md"
".agents/skills/finalize-implementation/references/phase-contracts.md" = "lean_sdd_templates/common/.agents/skills/finalize-implementation/references/phase-contracts.md"
".agents/skills/finalize-implementation/scripts/merge-implementation.sh" = "lean_sdd_templates/common/.agents/skills/finalize-implementation/scripts/merge-implementation.sh"
".agents/skills/finalize-implementation/scripts/publish-implementation.sh" = "lean_sdd_templates/common/.agents/skills/finalize-implementation/scripts/publish-implementation.sh"
".agents/skills/get-issue/SKILL.md" = "lean_sdd_templates/common/.agents/skills/get-issue/SKILL.md"
".agents/skills/get-issue/scripts/get-issue.sh" = "lean_sdd_templates/common/.agents/skills/get-issue/scripts/get-issue.sh"
".agents/skills/git-change-workflow/SKILL.md" = "lean_sdd_templates/common/.agents/skills/git-change-workflow/SKILL.md"
".agents/skills/git-change-workflow/scripts/prepare-change-branch.sh" = "lean_sdd_templates/common/.agents/skills/git-change-workflow/scripts/prepare-change-branch.sh"
".agents/skills/list-repositories/SKILL.md" = "lean_sdd_templates/common/.agents/skills/list-repositories/SKILL.md"
".agents/skills/list-repositories/scripts/list-repositories.sh" = "lean_sdd_templates/common/.agents/skills/list-repositories/scripts/list-repositories.sh"
".agents/skills/update-issue/SKILL.md" = "lean_sdd_templates/common/.agents/skills/update-issue/SKILL.md"
".agents/skills/update-issue/scripts/close-issue.sh" = "lean_sdd_templates/common/.agents/skills/update-issue/scripts/close-issue.sh"
".agents/skills/update-issue/scripts/comment-issue.sh" = "lean_sdd_templates/common/.agents/skills/update-issue/scripts/comment-issue.sh"
"src/lean_sdd/template_overrides/gitignore" = "lean_sdd_templates/common/.agents/.gitignore"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/lean_sdd",
    "tests",
    "pyproject.toml",
    "uv.lock",
    "README.md",
    "docs/configuration.md",
    "docs/profiles.md",
    "docs/typescript.md",
    "docs/diagnostics.md",
    "docs/validation.md",
    "docs/foundation-acceptance.md",
    "AGENTS.md",
    "CONSTITUTION.md",
    "CODING_STANDARDS.md",
    ".agents/README.md",
    ".agents/.env.example",
    ".agents/github-mcp-contract.md",
    ".agents/github-issue-contract.md",
    ".agents/lib/github-identity.sh",
    ".agents/lib/github-issues.sh",
    ".agents/lib/github-mcp.sh",
    ".agents/lib/github-pr.sh",
    ".agents/lib/mcp.sh",
    ".agents/skills/create-issue/SKILL.md",
    ".agents/skills/create-issue/scripts/create-issue.sh",
    ".agents/skills/finalize-implementation/SKILL.md",
    ".agents/skills/finalize-implementation/references/phase-contracts.md",
    ".agents/skills/finalize-implementation/scripts/merge-implementation.sh",
    ".agents/skills/finalize-implementation/scripts/publish-implementation.sh",
    ".agents/skills/get-issue/SKILL.md",
    ".agents/skills/get-issue/scripts/get-issue.sh",
    ".agents/skills/git-change-workflow/SKILL.md",
    ".agents/skills/git-change-workflow/scripts/prepare-change-branch.sh",
    ".agents/skills/list-repositories/SKILL.md",
    ".agents/skills/list-repositories/scripts/list-repositories.sh",
    ".agents/skills/update-issue/SKILL.md",
    ".agents/skills/update-issue/scripts/close-issue.sh",
    ".agents/skills/update-issue/scripts/comment-issue.sh",
]
exclude = [
    "**/__pycache__", "**/*.pyc", "**/.env*", "!**/.env.example",
    "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache",
    "**/node_modules", "**/.build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["typescript_toolchain: opt-in real Node/npm/Python acceptance"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
